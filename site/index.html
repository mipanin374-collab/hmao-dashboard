<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Помощник ХМАО</title><style>html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f6f8fc;color:#14213d}#load{min-height:100vh;display:grid;place-items:center;padding:24px}.box{background:#fff;border:1px solid #dce5ef;border-radius:16px;padding:24px;box-shadow:0 12px 36px #00000014;max-width:520px;text-align:center}b{display:block;font-size:24px;margin-bottom:8px}.mut{color:#75849a}</style></head><body><div id="load"><div class="box"><b>Помощник ХМАО</b><div id="msg">Загрузка сайта…</div><div class="mut">Графики · Точечные проверки · COMBO · Обучение</div></div></div><script>(async()=>{const m=document.getElementById('msg');try{const base='https://raw.githubusercontent.com/mipanin374-collab/hmao-dashboard/main/webapp/';const names=['app-part1.txt','app-part2.txt','app-part3.txt','app-part4.txt','app-part5.txt'];const parts=await Promise.all(names.map(async n=>{const r=await fetch(base+n+'?v=dc094100a6cd5943a2a79ee5cba83ea9396fa048',{cache:'no-store'});if(!r.ok)throw new Error(n+': '+r.status);return (await r.text()).trim()}));const b64=parts.join('');const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const full=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();if(!full.includes('ХМАО'))throw new Error('Пакет сайта поврежден');document.open();document.write(full);document.close()}catch(e){m.innerHTML='<span style="color:#c93240;font-weight:700">Не удалось открыть сайт.</span><br><span class="mut">'+e.message+'</span>'}})()</script></body></html>
