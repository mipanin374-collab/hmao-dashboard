<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Помощник ХМАО</title>
<style>
html,body{margin:0;min-height:100%;background:#f6f8fc;font-family:Arial,sans-serif;color:#14213d}
#boot{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.card{width:min(520px,92vw);padding:28px;border:1px solid #dce5ef;border-radius:18px;background:#fff;box-shadow:0 18px 50px #07396f18;text-align:center}
.spinner{width:42px;height:42px;margin:0 auto 16px;border:4px solid #e8eef5;border-top-color:#4fbe3e;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
small{color:#75849a}
</style>
</head>
<body>
<div id="boot"><div class="card"><div class="spinner"></div><h2>Помощник ХМАО</h2><div id="msg">Загружаю рабочую версию…</div><small>Графики • Точечные проверки • COMBO • Обучение • Заявки</small></div></div>
<script>
(async()=>{
  const msg=document.getElementById('msg');
  try{
    const base='https://raw.githubusercontent.com/mipanin374-collab/hmao-dashboard/main/webapp/';
    const names=['app-part1.txt','app-part2.txt','app-part3.txt','app-part4.txt','app-part5.txt'];
    const parts=[];
    for(const n of names){
      const r=await fetch(base+n+'?v=20260911-1',{cache:'no-store'});
      if(!r.ok) throw new Error(n+': '+r.status);
      parts.push((await r.text()).replace(/\s+/g,''));
    }
    const b64=parts.join('');
    if(!b64 || b64.length<10000) throw new Error('Неполный пакет сайта');
    const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    if(!('DecompressionStream' in window)) throw new Error('Нужен актуальный Chrome/Edge');
    const html=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    if(!/Помощник\s*ХМАО/i.test(html)) throw new Error('Пакет сайта не прошёл проверку');
    document.open();document.write(html);document.close();
  }catch(e){
    msg.innerHTML='<b style="color:#c62828">Не удалось загрузить портал.</b><br><small>'+String(e.message||e)+'</small>';
  }
})();
</script>
</body>
</html>
