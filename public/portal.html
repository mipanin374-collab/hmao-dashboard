function rub(v){return Math.round(v).toLocaleString('ru-RU')+' ₽'}function combo(){content.innerHTML=`<div class="combo"><h1>COMBO калькулятор</h1><div class="combo-controls"><select id="dev"><option value="android">Android</option><option value="apple">Apple</option></select><input id="price" value="29900" inputmode="numeric"></div><div id="res"></div></div>`;let calc=()=>{let p=+price.value.replace(/\D/g,'')||0;if(dev.value==='android')res.innerHTML=[20,25,30,35].map(d=>{let ph=p*(1-d/100),pl=ph+2050+p*.35,rg=ph+2050+p*.28;return `<div class="combo-card"><div class="combo-head">COMBO ${d}%</div><div class="combo-grid"><div>Комплекс+<b>${rub(pl)}</b></div><div>Комплекс<b>${rub(rg)}</b></div><div>12 мес. Комплекс+<b>${rub(pl/12)}</b></div><div>12 мес. Комплекс<b>${rub(rg/12)}</b></div></div></div>`}).join('')+`<div class="panel">Без COMBO: <b>${rub(p*1.25)}</b> · 12 мес. ${rub(p*1.25/12)} · 24 мес. ${rub(p*1.25/24)}</div>`;else{let ph=p*.85,pl=ph+2050+p*.35,rg=ph+2050+p*.28;res.innerHTML=`<div class="combo-card"><div class="combo-head">Apple · COMBO 15%</div><div class="combo-grid"><div>Комплекс+<b>${rub(pl)}</b></div><div>Комплекс<b>${rub(rg)}</b></div><div>12 мес.<b>${rub(rg/12)}</b></div><div>24/36 мес. Халва<b>${rub(rg/24)} / ${rub(rg/36)}</b></div></div></div>`}};dev.onchange=price.oninput=calc;calc()}
async function getTrain(){if(TRAIN)return TRAIN;let t=await fetch('/training.dat?v=2',{cache:'no-store'}).then(r=>r.text()),bin=Uint8Array.from(atob(t.trim()),c=>c.charCodeAt(0)),s=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));TRAIN=JSON.parse(await new Response(s).text());return TRAIN}
async function training(){content.innerHTML='<div class="train"><div class="trainhero"><h1>🎓 Обучение</h1><p class="mut">Только ХМАО. Данные из всех вкладок файла, где найден регион, офис или сотрудник ХМАО.</p></div><div id="trload">Загрузка…</div></div>';try{let T=await getTrain(),active=0,q='';trload.innerHTML=`<div class="trainbar"><input id="ts" placeholder="Поиск по сотруднику, ТМ, ТТ, обучению…"><span class="mut">${T.reduce((a,x)=>a+x.count,0)} строк · ${T.length} вкладок · обновление раз в 60 минут</span></div><div class="traintabs">${T.map((x,i)=>`<button data-i="${i}" class="${i===0?'on':''}">${e(x.name)} · ${x.count}</button>`).join('')}</div><div id="tout"></div>`;let draw=()=>{let sh=T[active],rows=sh.rows;if(q)rows=rows.filter(r=>r.v.some(v=>String(v).toLowerCase().includes(q)));tout.innerHTML=`<div class="traintable"><table><thead><tr><th>Строка</th>${sh.headers.map(h=>`<th>${e(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><td>${r.row}</td>${r.v.map(v=>`<td>${e(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`};document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{active=+b.dataset.i;document.querySelectorAll('[data-i]').forEach(x=>x.classList.toggle('on',x===b));draw()});ts.oninput=()=>{q=ts.value.toLowerCase();draw()};draw()}catch(x){trload.textContent='Не удалось открыть данные обучения: '+x.message}}
async function requests(){content.innerHTML='<div class="page"><h1>Заявки</h1><p class="mut">Одобрение и управление доступом сотрудников.</p><div id="rq">Загрузка…</div></div>';try{let d=await api('listUsers',{token:localStorage.getItem(TK)}),users=d.users||[];rq.innerHTML=users.length?users.map(u=>`<div class="req" data-id="${u.id}"><div class="req-head"><div><b>${e(u.fio)}</b><div class="req-note">${u.status==='pending'?'Ожидает решения':u.status==='approved'?'Доступ одобрен':'Доступ отклонён'}</div></div><span class="status ${u.status}">${u.status}</span></div><div class="req-controls"><label><b>Тип доступа</b><select class="r"><option value="full" ${u.access_role==='full'?'selected':''}>Полный доступ</option><option value="rdo" ${u.access_role==='rdo'?'selected':''}>РДО / ограниченный</option></select></label><div class="req-hidden"><b style="width:100%">Скрыть разделы для РДО:</b>${SECS.map(k=>`<label><input type="checkbox" value="${k}" ${u.rdo_hidden_sections?.includes(k)?'checked':''}> ${LAB[k]}</label>`).join('')}</div></div><div class="req-actions">${u.status!=='approved'?'<button class="approve">✓ Одобрить</button>':'<button class="saveaccess">Сохранить доступ</button>'}${u.status!=='rejected'?'<button class="reject">✕ Отклонить</button>':''}</div></div>`).join(''):'<div class="panel">Заявок нет</div>';document.querySelectorAll('.req').forEach(r=>{let a=r.querySelector('.approve'),sv=r.querySelector('.saveaccess'),b=r.querySelector('.reject');if(a)a.onclick=()=>saveAccess(r,'approved');if(sv)sv.onclick=()=>saveAccess(r,'approved');if(b)b.onclick=()=>saveAccess(r,'rejected')})}catch(x){rq.textContent=x.message}}
async function saveAccess(r,status){let btns=[...r.querySelectorAll('button')];btns.forEach(b=>b.disabled=true);try{await api('setAccess',{token:localStorage.getItem(TK),userId:r.dataset.id,status,role:r.querySelector('.r').value,hidden:[...r.querySelectorAll('.req-hidden input:checked')].map(x=>x.value)});await requests()}catch(x){alert('Не удалось сохранить доступ: '+x.message);btns.forEach(b=>b.disabled=false)}}
(async()=>{let t=localStorage.getItem(TK);if(!t)return auth();try{me=(await api('me',{token:t})).user;layout();view('home')}catch{localStorage.removeItem(TK);auth()}})();
</script></body></html>
